# Corporate theme for the Smart Hub (read when `streamlit run` is started from this folder).
# Server settings stay in ~/.streamlit/config.toml.
[theme]
base = "light"
primaryColor = "#20416C"              # Gestamp blue (sampled from the logo)
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#1F2933"
borderColor = "#D9DEE5"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
baseRadius = "medium"
headingFontSizes = ["1.875rem", "1.375rem", "1.125rem"]   # h1 (st.title), h2, h3
headingFontWeights = [650, 600, 600]

[theme.sidebar]
backgroundColor = "#FFFFFF"
